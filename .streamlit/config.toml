# Light webmail look for the email-view prototype.
[theme]
base = "light"
primaryColor = "#0b57d0"
backgroundColor = "#f6f8fc"
secondaryBackgroundColor = "#eaf1fb"
textColor = "#1f1f1f"

[client]
toolbarMode = "minimal"
# Visitors see a generic message on errors; details go to the server log only.
showErrorDetails = "none"
